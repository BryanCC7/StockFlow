spring.application.name=stockflow
server.port=8080

# H2 portable (archivo local + consola habilitada para demo)
spring.datasource.url=jdbc:h2:file:./data/stockflow;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DDL + seed via scripts versionados (portable, sin SQL nativo fuera de estos)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# JPA: valida contra schema.sql (no genera DDL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Evita N+1 fuera de transaccion: todo acceso LAZY ocurre dentro de @Transactional + @EntityGraph
spring.jpa.open-in-view=false

# Paginacion por defecto
spring.data.web.pageable.default-page-size=20
